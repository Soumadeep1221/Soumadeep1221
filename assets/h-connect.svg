<svg xmlns="http://www.w3.org/2000/svg" width="700" height="52" viewBox="0 0 700 52" role="img" aria-label="Connect">
<title>Connect</title>
<style>
text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;}
.bar{transform-box:fill-box;transform-origin:center;animation:bar 2.6s ease-in-out infinite}
@keyframes bar{0%,100%{transform:scaleY(1);opacity:.85}50%{transform:scaleY(.55);opacity:1}}
.slide{animation:sl .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes sl{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
.run{animation:run 4s ease-in-out infinite}
@keyframes run{0%{transform:translateX(-110px)}100%{transform:translateX(559px)}}
</style>
<defs><linearGradient id="ul" x1="0" x2="1"><stop offset="0" stop-color="#34d399" stop-opacity=".9"/><stop offset="1" stop-color="#30363d" stop-opacity="0"/></linearGradient>
<linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#34d399" stop-opacity="0"/><stop offset=".5" stop-color="#34d399"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></linearGradient>
<clipPath id="lc"><rect x="141.1" y="20" width="558.9" height="12"/></clipPath></defs>
<rect class="bar" x="2" y="12" width="5" height="26" rx="2.5" fill="#34d399"/>
<text class="slide" x="22" y="34" font-size="24" font-weight="700" fill="#e6edf3" textLength="101.1" lengthAdjust="spacing">Connect</text>
<rect x="141.1" y="25" width="558.9" height="2" fill="url(#ul)" opacity=".7"/>
<g clip-path="url(#lc)"><rect class="run" x="141.1" y="24.5" width="110" height="3" rx="1.5" fill="url(#gl)"/></g>
<rect x="0" y="49.5" width="700" height="1" fill="#30363d" opacity=".6"/>
</svg>
