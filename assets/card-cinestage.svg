<svg xmlns="http://www.w3.org/2000/svg" width="700" height="342" viewBox="0 0 700 342" role="img" aria-label="CineStage-Backend: Spring Boot REST API for CineStage, a cinema ticket booking platform. Handles cities, theatres, screens, seats, shows, users, and bookings, with live poster fetching via the TMDB API. Language: Java. Framework: Spring Boot (REST API). Security: Spring Security, JWT. Database: PostgreSQL. External API: TMDB API (live posters). Deployment: Render, Neon, Netlify" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>CineStage-Backend: Spring Boot REST API for CineStage, a cinema ticket booking platform. Handles cities, theatres, screens, seats, shows, users, and bookings, with live poster fetching via the TMDB API. Language: Java. Framework: Spring Boot (REST API). Security: Spring Security, JWT. Database: PostgreSQL. External API: TMDB API (live posters). Deployment: Render, Neon, Netlify</title>
<style>
