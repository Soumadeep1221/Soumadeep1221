<svg xmlns="http://www.w3.org/2000/svg" width="700" height="150" viewBox="0 0 700 150" role="img" aria-label="Footer wave">
<title>Footer wave</title>
<style>
text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;}
.w1{animation:wv 16s linear infinite}
.w2{animation:wv 11s linear infinite}
.w3{animation:wv 7.5s linear infinite}
@keyframes wv{from{transform:translateX(0)}to{transform:translateX(-700px)}}
.bub{animation:bub 6s ease-in infinite}
@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-70px);opacity:0}}
</style>
<defs><clipPath id="card"><rect width="700" height="150" rx="12"/></clipPath>
<linearGradient id="bgf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0c1f19"/></linearGradient></defs>
<g clip-path="url(#card)">
<rect width="700" height="150" fill="url(#bgf)"/>
<path class="w1" d="M0 82 Q87.5 66 175.0 82 T350.0 82 T525.0 82 T700.0 82 T875.0 82 T1050.0 82 T1225.0 82 T1400.0 82 T1575.0 82 T1750.0 82 L1750.0 150 L0 150 Z" fill="#34d399" fill-opacity=".16"/>
<path class="w2" d="M0 96 Q87.5 82 175.0 96 T350.0 96 T525.0 96 T700.0 96 T875.0 96 T1050.0 96 T1225.0 96 T1400.0 96 T1575.0 96 T1750.0 96 L1750.0 150 L0 150 Z" fill="#34d399" fill-opacity=".32"/>
<path class="w3" d="M0 112 Q87.5 101 175.0 112 T350.0 112 T525.0 112 T700.0 112 T875.0 112 T1050.0 112 T1225.0 112 T1400.0 112 T1575.0 112 T1750.0 112 L1750.0 150 L0 150 Z" fill="#34d399" fill-opacity=".9"/>
<circle class="bub" cx="120" cy="140" r="3" fill="#34d399" fill-opacity=".5" style="animation-delay:0s"/>
<circle class="bub" cx="330" cy="140" r="2.4" fill="#34d399" fill-opacity=".5" style="animation-delay:-2.2s"/>
<circle class="bub" cx="560" cy="140" r="3.2" fill="#34d399" fill-opacity=".5" style="animation-delay:-4.1s"/>
</g>
<rect x="0.5" y="0.5" width="699" height="149" rx="12" fill="none" stroke="#30363d"/>
</svg>
